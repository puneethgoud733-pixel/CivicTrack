{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card p-4">
            <h3 class="text-center mb-4">Register User Profile</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select bg-dark text-white border-secondary">
                        <option value="Citizen">Citizen</option>
                        <option value="Admin">Department Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-info text-white w-100">Create Account</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
