<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ code }} - CivicTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            background: white;
            border-radius: 10px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
        }
        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 0;
        }
        .error-message {
            font-size: 20px;
            color: #333;
            margin: 20px 0;
        }
        .back-button {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">{{ code }}</h1>
        <p class="error-message">{{ message }}</p>
        <p style="color: #999;">Something went wrong on our end.</p>
        <div class="back-button">
            <a href="/" class="btn btn-primary">Go Back Home</a>
        </div>
    </div>
</body>
</html>
